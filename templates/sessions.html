<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Subject Attendance Sessions</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
            color: #17202a;
        }

        .wrap {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 18px;
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.08);
        }

        h1,
        h2 {
            margin-top: 0;
        }

        select,
        button,
        a.btn {
            font-size: 16px;
            padding: 11px 14px;
            border-radius: 9px;
            border: 1px solid #cbd5e1;
        }

        select {
            min-width: 280px;
            background: white;
        }

        button,
        a.btn {
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin: 6px 6px 6px 0;
        }

        button.primary,
        a.primary {
            background: #111827;
            color: white;
            border-color: #111827;
        }

        button.danger {
            background: #b91c1c;
            color: white;
            border-color: #b91c1c;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            font-weight: 700;
        }

        .timer {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 12px 0;
        }

        .muted {
            color: #64748b;
        }

        #message {
            min-height: 24px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="wrap">

    <div class="card">

        <h1>Subject Attendance Session</h1>

        <p class="muted">
            Choose one subject and start a 60-minute scanner session.
        </p>

        <select id="subject">
            <option value="">Loading subjects...</option>
        </select>

        <button
            type="button"
            class="primary"
            id="startBtn"
            disabled
        >
            Start 1-Hour Session
        </button>

        <div id="message"></div>

    </div>


    <div class="card">

        <h2>Current Session</h2>

        <div
            class="status"
            id="sessionStatus"
        >
            Loading...
        </div>

        <div
            class="timer"
            id="timer"
        >
            --:--
        </div>

        <div
            id="sessionInfo"
            class="muted"
        ></div>


        <div style="margin-top: 18px;">

            <a
                class="btn primary"
                href="/scan?mode=face"
                id="faceScannerBtn"
            >
                Open Face Scanner
            </a>

            <a
                class="btn primary"
                href="/scan?mode=qr"
                id="qrScannerBtn"
            >
                Open QR Scanner
            </a>

            <button
                type="button"
                class="danger"
                id="endBtn"
                disabled
            >
                End Session Now
            </button>

            <a
                class="btn"
                href="/"
            >
                Back to Dashboard
            </a>

        </div>

    </div>

</div>


<script>

"use strict";


let csrfToken = "";
let currentSession = null;
let timerInterval = null;


/* -----------------------------------
   API REQUEST
----------------------------------- */

async function api(url, options = {}) {

    const headers = {
        ...(options.headers || {})
    };


    if (options.method && options.method !== "GET") {

        if (!csrfToken) {
            throw new Error(
                "Security token is not ready. Refresh the page and try again."
            );
        }

        headers["X-CSRF-Token"] = csrfToken;
        headers["Content-Type"] = "application/json";
    }


    const response = await fetch(
        url,
        {
            ...options,
            headers
        }
    );


    let data;

    try {
        data = await response.json();
    } catch (error) {
        throw new Error(
            "Server returned an invalid response."
        );
    }


    if (!response.ok) {
        throw new Error(
            data.message || "Request failed."
        );
    }


    return data;
}


/* -----------------------------------
   MESSAGE
----------------------------------- */

function showMessage(text, isError = false) {

    const messageElement =
        document.getElementById("message");


    messageElement.textContent =
        text || "";


    messageElement.style.color =
        isError ? "#b91c1c" : "#166534";
}


/* -----------------------------------
   FORMAT DATE/TIME
----------------------------------- */

function formatDateTime(value) {

    if (!value) {
        return "-";
    }


    const date =
        new Date(value);


    if (Number.isNaN(date.getTime())) {
        return value;
    }


    return date.toLocaleString();
}


/* -----------------------------------
   TIMER
----------------------------------- */

function renderTimer() {

    const timerElement =
        document.getElementById("timer");


    if (!currentSession) {

        timerElement.textContent =
            "--:--";

        return;
    }


    const expiryTime =
        new Date(
            currentSession.expires_at
        ).getTime();


    if (Number.isNaN(expiryTime)) {

        timerElement.textContent =
            "--:--";

        return;
    }


    const remainingSeconds =
        Math.max(
            0,
            Math.floor(
                (expiryTime - Date.now()) / 1000
            )
        );


    const minutes =
        String(
            Math.floor(
                remainingSeconds / 60
            )
        ).padStart(2, "0");


    const seconds =
        String(
            remainingSeconds % 60
        ).padStart(2, "0");


    timerElement.textContent =
        `${minutes}:${seconds}`;


    if (remainingSeconds <= 0) {

        currentSession = null;

        renderSession();

        loadState();
    }
}


/* -----------------------------------
   SESSION DISPLAY
----------------------------------- */

function renderSession() {

    const statusElement =
        document.getElementById(
            "sessionStatus"
        );


    const infoElement =
        document.getElementById(
            "sessionInfo"
        );


    const endButton =
        document.getElementById(
            "endBtn"
        );


    const faceButton =
        document.getElementById(
            "faceScannerBtn"
        );


    const qrButton =
        document.getElementById(
            "qrScannerBtn"
        );


    if (!currentSession) {

        statusElement.textContent =
            "No active session — scanner is CLOSED";


        infoElement.textContent = "";


        endButton.disabled = true;


        faceButton.style.pointerEvents =
            "none";

        faceButton.style.opacity =
            "0.5";


        qrButton.style.pointerEvents =
            "none";

        qrButton.style.opacity =
            "0.5";


    } else {

        statusElement.textContent =
            `${currentSession.subject_name} — scanner is ACTIVE`;


        infoElement.textContent =
            `Started: ${formatDateTime(
                currentSession.started_at
            )} | Closes: ${formatDateTime(
                currentSession.expires_at
            )}`;


        endButton.disabled = false;


        faceButton.style.pointerEvents =
            "auto";

        faceButton.style.opacity =
            "1";


        qrButton.style.pointerEvents =
            "auto";

        qrButton.style.opacity =
            "1";
    }


    renderTimer();
}


/* -----------------------------------
   LOAD SUBJECTS + SESSION
----------------------------------- */

async function loadState() {

    try {

        const data =
            await api("/api/state");


        if (data.csrf_token) {

            csrfToken =
                data.csrf_token;
        }


        const subjectSelect =
            document.getElementById(
                "subject"
            );


        const startButton =
            document.getElementById(
                "startBtn"
            );


        const previousValue =
            subjectSelect.value;


        subjectSelect.innerHTML = "";


        if (
            !data.subjects ||
            data.subjects.length === 0
        ) {

            const option =
                document.createElement(
                    "option"
                );


            option.value = "";

            option.textContent =
                "No subjects available";


            subjectSelect.appendChild(
                option
            );


            startButton.disabled = true;


        } else {

            data.subjects.forEach(
                function (subject) {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        String(subject.id);


                    option.textContent =
                        subject.name;


                    subjectSelect.appendChild(
                        option
                    );
                }
            );


            if (previousValue) {

                subjectSelect.value =
                    previousValue;
            }


            startButton.disabled = false;
        }


        currentSession =
            data.current_session || null;


        renderSession();


    } catch (error) {

        showMessage(
            error.message,
            true
        );
    }
}


/* -----------------------------------
   START SESSION
----------------------------------- */

async function startSession() {

    try {

        const subjectSelect =
            document.getElementById(
                "subject"
            );


        const subjectId =
            Number(
                subjectSelect.value
            );


        if (
            !Number.isInteger(subjectId) ||
            subjectId <= 0
        ) {

            throw new Error(
                "Please select a subject."
            );
        }


        const data =
            await api(
                "/api/sessions/start",
                {
                    method: "POST",
                    body: JSON.stringify({
                        subject_id: subjectId
                    })
                }
            );


        currentSession =
            data.current_session;


        showMessage(
            data.message
        );


        renderSession();


    } catch (error) {

        showMessage(
            error.message,
            true
        );
    }
}


/* -----------------------------------
   END SESSION
----------------------------------- */

async function endSession() {

    if (!currentSession) {
        return;
    }


    try {

        const sessionId =
            currentSession.id;


        const data =
            await api(
                `/api/sessions/${sessionId}/end`,
                {
                    method: "POST",
                    body: JSON.stringify({})
                }
            );


        currentSession = null;


        showMessage(
            data.message
        );


        renderSession();


    } catch (error) {

        showMessage(
            error.message,
            true
        );
    }
}


/* -----------------------------------
   BUTTON EVENTS
----------------------------------- */

document
    .getElementById("startBtn")
    .addEventListener(
        "click",
        startSession
    );


document
    .getElementById("endBtn")
    .addEventListener(
        "click",
        endSession
    );


/* -----------------------------------
   START PAGE
----------------------------------- */

loadState();


timerInterval =
    window.setInterval(
        renderTimer,
        1000
    );

</script>

</body>
</html>
